modLoader="javafml"
loaderVersion="[47,)"
license="${mod_licence}"
issueTrackerURL="https://github.com/WillTDA/SimpleSchematics/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/WillTDA/SimpleSchematics"
logoFile="icon.png"
logoBlur=false
credits="Inspired by Litematica by masa. Built independently, no shared code."
authors="${mod_authors}"
# Client only. The server never needs this mod installed.
displayTest="IGNORE_SERVER_VERSION"
description='''Guided building made easy.'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="CLIENT"
